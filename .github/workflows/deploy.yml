name: Build and deploy

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: haverfotografie-production
  cancel-in-progress: false

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "image=${image}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "latest=${image}:latest" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.image }}
            ${{ steps.image.outputs.latest }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy on server
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          APP_IMAGE: ${{ needs.build.outputs.image }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          set -euo pipefail
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_PATH DEPLOY_SSH_KEY GHCR_USERNAME GHCR_TOKEN APP_IMAGE; do
            if [ -z "${!name}" ]; then
              echo "Missing required secret or output: $name" >&2
              exit 1
            fi
          done
          [[ "$DEPLOY_PATH" == /* ]] || { echo 'DEPLOY_PATH must be absolute' >&2; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          trap 'rm -f ~/.ssh/deploy_key' EXIT
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          remote="$DEPLOY_USER@$DEPLOY_HOST"
          ssh_options=(-i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes)
          printf -v target_path '%q' "$DEPLOY_PATH"
          printf -v registry_user '%q' "$GHCR_USERNAME"
          printf -v app_image '%q' "$APP_IMAGE"
          ssh "${ssh_options[@]}" "$remote" "mkdir -p -- $target_path"
          tar -czf - deploy.sh docker-compose.prod.yml |
            ssh "${ssh_options[@]}" "$remote" "tar -xzf - -C $target_path"
          printf '%s' "$GHCR_TOKEN" |
            ssh "${ssh_options[@]}" "$remote" "docker login ghcr.io -u $registry_user --password-stdin"
          ssh "${ssh_options[@]}" "$remote" "cd -- $target_path && APP_IMAGE=$app_image bash ./deploy.sh"
