services:
  web:
    build: .
    ports:
      - '8008:80'
    volumes:
      - './HaverFotografie.php:/var/www/html/index.php:ro'
      - './admin/index.php:/var/www/html/admin/index.php:ro'
      - './logo.png:/var/www/html/logo.png:ro'
      - './favicon.svg:/var/www/html/favicon.svg:ro'
    environment:
      DB_HOST: db
      DB_PORT: '3306'
      DB_NAME: CustomerDB
      DB_USER: root
      DB_PASS: secret
    depends_on:
      - db

  db:
    image: mysql:8.0
    command: --max_allowed_packet=256M
    ports:
      - '${DB_FORWARD_PORT:-3310}:3306'
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: CustomerDB
    volumes:
      - db_data:/var/lib/mysql
      - './db-init:/docker-entrypoint-initdb.d:ro'

volumes:
  db_data:
