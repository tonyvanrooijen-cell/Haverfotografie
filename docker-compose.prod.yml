services:
  web:
    image: ${APP_IMAGE:?APP_IMAGE must point to the published GHCR image}
    restart: unless-stopped
    ports:
      - '${WEB_BIND_ADDRESS:-0.0.0.0}:${WEB_PORT:-8008}:80'
    healthcheck:
      test: ['CMD', 'php', '-r', 'exit(@fsockopen("127.0.0.1", 80) ? 0 : 1);']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
